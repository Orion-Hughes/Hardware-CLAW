name: DHT22 and OLED automated test
version: 1
author: Hardware-CLAW

steps:
  - wait-serial: "HWCLAW_READY"
  - set-control:
      part-id: dht1
      name: temperature
      value: 26.5
  - set-control:
      part-id: dht1
      name: humidity
      value: 63
  - delay: 2500ms
  - wait-serial: "DATA T=26.5 H=63.0"
  - take-screenshot:
      part-id: oled1
      save-to: "../../../temp/wokwi_dht22_oled_cli/oled-result.png"
